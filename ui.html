<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Switchboard</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b141a;color:#e2ebef}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:2;padding:22px 26px 16px;background:#0b141af5;border-bottom:1px solid #263640}h1{margin:0;font-size:23px;letter-spacing:-.02em}h1 span{color:#ff903f}header p{font-size:13px;color:#8fa5af;margin:5px 0 0}.status{float:right;font-size:12px;color:#8fa5af}.status.ok{color:#75cfaa}.status.error{color:#ff8a80}main{padding:10px 26px 30px}section{margin-top:24px}h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#91a9b4;margin:0 0 10px}.count{color:#526b77;margin-left:6px}.list{border:1px solid #253943;border-radius:9px;overflow:hidden;background:#121f27}.item{display:flex;align-items:center;gap:16px;min-height:58px;padding:10px 14px;border-bottom:1px solid #253943}.item:last-child{border:0}.text{min-width:0;flex:1}.name{font-weight:600;font-size:14px;overflow-wrap:anywhere}.detail{margin-top:3px;color:#829ba7;font-size:12px;overflow-wrap:anywhere}.switch{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0;color:#a8bec8;font-size:12px;font-weight:650}.switch input{appearance:none;width:36px;height:21px;margin:0;border-radius:20px;background:#3b4e58;position:relative;cursor:pointer;transition:background .15s}.switch input:before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;border-radius:100%;background:#e9f0f2;transition:transform .15s}.switch input:checked{background:#ee8337}.switch input:checked:before{transform:translateX(15px)}.switch input:focus-visible{outline:2px solid white;outline-offset:3px}.switch input:disabled{opacity:.5}.empty{padding:15px;color:#78909a;font-size:13px}footer{margin-top:22px;color:#718995;font-size:12px;line-height:1.5}.errorbox{margin-top:16px;color:#ffaaa1;font-size:13px;white-space:pre-wrap}button{border:0}
</style></head><body><header><div class="status" id="status">Connecting…</div><h1>Audio <span>Switchboard</span></h1><p>Mute controls for your devices and apps</p></header><main><div id="error" class="errorbox" role="alert"></div><div id="sections"></div><footer>On = audio enabled · Off = muted. App streams appear when active. Changes apply immediately.</footer></main><script>
const groups=[['playback','Playing apps'],['recording','Recording apps'],['outputs','Speakers & outputs'],['inputs','Microphones & inputs']];
const sections=document.querySelector('#sections'), status=document.querySelector('#status'), error=document.querySelector('#error');let pending=new Set(),busy=false;
function render(items){for(const [kind,title] of groups){let group=document.getElementById('group-'+kind);if(!group){group=document.createElement('section');group.id='group-'+kind;group.innerHTML='<h2></h2><div class="list"></div>';sections.appendChild(group)}let list=items.filter(x=>x.kind===kind);group.querySelector('h2').textContent=title+'  ·  '+list.length;let box=group.querySelector('.list');let wanted=new Set();for(const item of list){let key=item.kind+'-'+item.index;wanted.add(key);let row=document.getElementById(key);if(!row){row=document.createElement('div');row.className='item';row.id=key;row.innerHTML='<div class="text"><div class="name"></div><div class="detail"></div></div><label class="switch"><span></span><input type="checkbox"></label>';box.appendChild(row)}row.querySelector('.name').textContent=item.name;row.querySelector('.detail').textContent=item.detail||'';let toggle=row.querySelector('input');toggle.setAttribute('aria-label','Enable audio: '+item.name);if(!pending.has(key)){toggle.checked=!item.muted;toggle.disabled=false;row.querySelector('.switch span').textContent=item.muted?'Muted':'On'}toggle.onchange=()=>change(item,toggle,key)}for(const row of [...box.querySelectorAll('.item')])if(!wanted.has(row.id)&&!pending.has(row.id))row.remove();let empty=box.querySelector('.empty');if(!list.length&&!empty){empty=document.createElement('div');empty.className='empty';empty.textContent='Nothing active';box.appendChild(empty)}else if(list.length&&empty)empty.remove()}}
async function refresh(){if(busy)return;busy=true;try{let res=await fetch('api/items',{cache:'no-store'});if(!res.ok)throw Error(await res.text());let data=await res.json();render(data);status.textContent='● Live';status.className='status ok';error.textContent=''}catch(e){status.textContent='● Disconnected';status.className='status error';error.textContent='Could not read audio devices: '+e.message}finally{busy=false}}
async function change(item,toggle,key){let muted=!toggle.checked;pending.add(key);toggle.disabled=true;try{let res=await fetch('api/mute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:item.kind,index:item.index,muted})});if(!res.ok)throw Error(await res.text())}catch(e){error.textContent='Could not change mute: '+e.message}finally{pending.delete(key);await refresh()}}
refresh();setInterval(refresh,1500);
</script></body></html>
